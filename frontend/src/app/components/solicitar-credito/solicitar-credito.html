<div class="solicitud-container" style="max-width: 600px; margin: 40px auto; padding: 30px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 8px; font-family: sans-serif;">
  <h2 style="color: #0056b3; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 20px;">
    Simulador y Solicitud de Crédito Empresarial
  </h2>
  
  <form (ngSubmit)="enviarSolicitud()">
    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Tipo de Crédito</label>
      <select [(ngModel)]="credito.tipo_credito" name="tipo_credito" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" required>
        <option value="capital">Crédito Capital de Trabajo</option>
        <option value="activo">Crédito Activo Fijo</option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Monto a Solicitar (S/)</label>
      <input type="number" [(ngModel)]="credito.monto" name="monto" (input)="calcularCuotaEstimada()" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" placeholder="Ej. 15000" required>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Plazo (Meses)</label>
      <input type="number" [(ngModel)]="credito.plazo" name="plazo" (input)="calcularCuotaEstimada()" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" placeholder="Ej. 12" required>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display:block; font-weight:bold; margin-bottom:5px;">Ingreso Mensual Neto de la Empresa (S/)</label>
      <input type="number" [(ngModel)]="credito.ingreso_mensual" name="ingreso_mensual" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;" placeholder="Ej. 5000" required>
    </div>

    <div style="background: #f7f9fc; padding: 15px; border-radius: 4px; margin-bottom: 20px; border-left: 5px solid #0056b3;">
      <p style="margin: 0; font-size: 14px; color: #555;">Cuota Mensual Estimada (Ref: Tasa Demo):</p>
      <h3 style="margin: 5px 0 0 0; color: #28a745;">S/ {{ credito.cuota | number:'1.2-2' }}</h3>
    </div>

    <button type="submit" style="width:100%; background:#0056b3; color:white; padding:12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; font-size:16px;">
      🚀 Enviar Solicitud al Sistema Central
    </button>
  </form>
</div>
