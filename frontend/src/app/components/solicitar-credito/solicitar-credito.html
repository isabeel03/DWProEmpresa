<div class="solicitud-container">
  <div class="solicitud-card">
    <div class="card-header">
      <h2>Simulador de Crédito Personal</h2>
      <p>Completa los datos solicitados para evaluar tu préstamo en tiempo real.</p>
    </div>

    <form (ngSubmit)="enviarSolicitud()" class="solicitud-form">
      
      <div class="form-group">
        <label for="clienteId">Código de Cliente o DNI:</label>
        <input type="text" id="clienteId" name="clienteId" [(ngModel)]="solicitud.cliente_id" placeholder="Ej: cli000007 o tu DNI" required>
      </div>

      <div class="form-group">
        <label for="tipoCredito">Tipo de Crédito:</label>
        <select id="tipoCredito" name="tipoCredito" [(ngModel)]="solicitud.tipo_credito">
          <option value="Consumo">Consumo / Personal</option>
          <option value="Microempresa">Microempresa (Capital de Trabajo)</option>
          <option value="Hipotecario">Hipotecario / Vivienda</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label for="monto">Monto Solicitado (S/):</label>
          <input type="number" id="monto" name="monto" [(ngModel)]="solicitud.monto" (input)="calcularCuotaDefecto()" placeholder="Ej: 5000" required>
        </div>
        <div class="form-group col">
          <label for="plazo">Plazo (Meses):</label>
          <input type="number" id="plazo" name="plazo" [(ngModel)]="solicitud.plazo" (input)="calcularCuotaDefecto()" placeholder="Ej: 12" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label for="ingresoMensual">Ingreso Neto Mensual (S/):</label>
          <input type="number" id="ingresoMensual" name="ingresoMensual" [(ngModel)]="solicitud.ingreso_mensual" placeholder="Ej: 2500" required>
        </div>
        <div class="form-group col">
          <label for="cuota">Cuota Mensual Estimada (S/):</label>
          <input type="number" id="cuota" name="cuota" [(ngModel)]="solicitud.cuota" readonly style="background: #e9ecef; font-weight: bold; color: #0056b3;">
          <small class="help-text">* Calculado automáticamente con tasa base (1.5% mensual)</small>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">🚀 Enviar Solicitud al Core</button>
        <button type="button" class="btn-cancel" (click)="cancelar()">Regresar</button>
      </div>

    </form>
  </div>
</div>
