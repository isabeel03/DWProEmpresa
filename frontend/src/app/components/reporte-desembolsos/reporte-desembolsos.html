<div class="dashboard-container">
  <button routerLink="/core-bancario" class="btn-back">← Volver</button>
  <div class="dashboard-card">
    <h2>Créditos Desembolsados</h2>

    <div *ngIf="cargando">Cargando datos de Supabase...</div>

    <ng-container *ngIf="!cargando">
      <div style="display: flex; gap: 10px; align-items: flex-end; height: 150px; padding: 20px;">
        <div *ngFor="let c of creditos.slice(0, 8)"
             style="flex: 1; background: #3182ce; border-radius: 4px;"
             [style.height.%]="alturaBarra(c.monto_desembolsado)"
             [title]="'S/ ' + c.monto_desembolsado">
        </div>
      </div>

      <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
        <tr style="color: #a0aec0; border-bottom: 1px solid #2d3748;">
          <th style="padding: 10px;">Operación</th>
          <th>Cliente</th>
          <th>Monto</th>
          <th>Fecha</th>
        </tr>
        <tr *ngFor="let c of creditos" style="border-bottom: 1px solid #2d3748;">
          <td style="padding: 10px;">OP-{{ c.id }}</td>
          <td>{{ c.cliente_id || c.cliente_codigo_desarrollo }}</td>
          <td>S/ {{ c.monto_desembolsado | number:'1.0-0' }}</td>
          <td>{{ c.fecha_desembolso | date:'dd/MM/yyyy' }}</td>
        </tr>
        <tr *ngIf="creditos.length === 0">
          <td colspan="4" style="padding: 20px; text-align: center; color: #a0aec0;">
            Aún no hay créditos desembolsados.
          </td>
        </tr>
      </table>
    </ng-container>
  </div>
</div>
